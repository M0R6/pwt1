<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
       <div class="container-fluid">
         <a class="navbar-brand" href="#">
            <i class="bi bi-book-half"></i>
         </a>
         <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
         </button>
         <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
               <li class="nav-item">
                  <a class="nav-link" href="index.html">Home</a>
               </li>
               <li class="nav-item">
                  <a class="nav-link" href="lihat.html">Lihat Data</a>
               </li>
               <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="tambah.html">Tambah Data</a>
               </li>
            </ul>
         </div>
      </div>
   </nav>
    <div class="kartu">
       <h1 style="margin: 20px auto; text-align: center;">Formulir Pendataan Mahasiswa</h1>
       <div class="kartu-form">
         <form method="get" action="lihat.html">
            <div class="mb-3">
               <label for="inputNama" class="form-label">Nama Lengkap Mahasiswa</label>
               <input type="text" name="nama" class="form-control" id="inputNama" placeholder="Nama lengkap mahasiswa...">
            </div>
            <div class="mb-3">
               <label for="inputAngkatan" class="form-label">Angkatan</label>
               <input type="number" name="angkatan" class="form-control" id="inputAngkatan" placeholder="Tahun angkatan mahasiswa...">
            </div>
            <label for="radioGender" class="form-label">Gender</label>
            <div class="form-check">
               <input class="form-check-input" type="radio" name="radioGender" id="perempuan">
               <label class="form-check-label" for="perempuan">
                  Perempuan
               </label>
            </div>
            <div class="form-check">
               <input class="form-check-input" type="radio" name="radioGender" id="laki">
               <label class="form-check-label" for="laki">
                  Laki-laki
               </label>
            </div>
            <br>
            <label for="checkboxSibuk" class="form-label">Kesibukan</label>
            <div class="form-check">
               <input class="form-check-input" type="checkbox" name="checkboxSibuk" value="Magang" id="checkboxMagang">
               <label class="form-check-label" for="checkboxMagang">
                  Magang
               </label>
            </div>
            <div class="form-check">
               <input class="form-check-input" type="checkbox" name="checkboxSibuk" value="Asisten" id="checkboxAsisten">
               <label class="form-check-label" for="checkboxAsisten">
                  Magang
               </label>
            </div>
            <div class="form-check">
               <input class="form-check-input" type="checkbox" name="checkboxSibuk" value="Lomba" id="checkboxLomba">
               <label class="form-check-label" for="checkboxLomba">
                  Lomba
               </label>
            </div>
            <div class="form-check">
               <input class="form-check-input" type="checkbox" name="checkboxSibuk" value="Organisasi" id="checkboxOrganisasi">
               <label class="form-check-label" for="checkboxOrganisasi">
                  Organisasi
               </label>
            </div>
            <br>
            <div>
               <button type="submit" class="btn btn-dark">+ Tambah data</button>
            </div>
          </form>
       </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
